[package]
name = "volt-engine"
version = "0.1.0"
edition = "2021"
description = "VOLT's audio engine, in Rust"

# The whole bet of this crate, in one dependency.
#
# VOLT's 14 instruments and 15 effects are not hand-written DSP — they are Web Audio node graphs
# (oscillators, biquads, waveshapers, delays, a convolver, a compressor) wired up in beta2.html.
# Rewriting that as bespoke Rust DSP is the 10-16 week wall in ROADMAP.md, and every unit would
# be an approximation we'd have to argue about by ear.
#
# `web-audio-api` is that same API, spec-compliant, in Rust. So each instrument ports as a
# transliteration of the JS that already exists — same nodes, same parameter automation, same
# order — and "did the port work" becomes a null test against the browser's own render rather
# than a matter of opinion. The ASIO output we measured at 1.45 ms comes free underneath it,
# because the crate's default backend is the same cpal the probe used.
[dependencies]
web-audio-api = { version = "1.7", default-features = false, features = ["cpal"] }
serde = { version = "1", features = ["derive"] }

# The VST3 host. Its own crate because a plugin is somebody else's code running in our process —
# see native/vsthost/src/lib.rs. `vst.rs` is the join: a plugin as a node in this crate's graph.
volt-vsthost = { path = "../vsthost" }
serde_json = "1"

# VOLT's fork of the crate, vendored at native/vendor/web-audio-api.
#
# One change, in src/io/cpal.rs: upstream binds a SINGLE audio host and takes every device from it,
# which is why `cpal-asio` compiled the ASIO backend in and then never used it — on Windows the
# chosen host is always WASAPI. The fork enumerates every host, labels each device with the API it
# came through, and resolves a sink_id back to the host that owns it. That is what makes choosing
# an ASIO interface possible at all. Rebased on 1.7.0; every edit is marked `VOLT FORK`.
[patch.crates-io]
web-audio-api = { path = "../vendor/web-audio-api" }

[features]
# ASIO needs the Steinberg SDK on disk and clang, exactly as native/probe does:
#   $env:CPAL_ASIO_DIR = "C:\Users\Mickey\sdk\ASIOSDK"; $env:LIBCLANG_PATH = "C:\Program Files\LLVM\bin"
# Off by default so a plain `cargo build` works on a machine without either.
asio = ["web-audio-api/cpal-asio"]

# Offline renderer used by the parity harness. Not the live engine — this one exists to prove the
# ported instruments match the browser sample for sample before anything gets built on top.
[[bin]]
name = "render"
path = "src/bin/render.rs"

# Live output, and the ASIO latency question answered through the real engine rather than through
# a standalone cpal probe. Build with --features asio to get the ASIO hosts.
[[bin]]
name = "live"
path = "src/bin/live.rs"

[profile.release]
opt-level = 3

[dev-dependencies]
# examples/devdump.rs only: a println logger so the fork's enumeration warnings are visible.
log = { version = "0.4", features = ["std"] }
