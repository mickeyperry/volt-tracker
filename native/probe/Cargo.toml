[package]
name = "volt-latency-probe"
version = "0.1.0"
edition = "2021"

# Deliberately throwaway. This exists to answer one question with a number instead of a claim:
# what output latency can this machine actually reach through a native audio API, compared with
# the ~20-40 ms a browser gives us? Everything about the "should VOLT get a Rust engine" decision
# hangs on that figure, so measure it before building anything on top of it.

[dependencies]
# The `asio` feature is what gets us off the OS mixer and onto the driver. It needs the Steinberg
# ASIO SDK on disk (CPAL_ASIO_DIR) and clang, because it generates bindings from the C++ headers.
# The SDK is deliberately NOT in this repo: its licence forbids redistribution, and this repo is
# public. See native/README.md for where it goes.
cpal = { version = "0.15", features = ["asio"] }

[[bin]]
name = "probe"
path = "src/main.rs"
